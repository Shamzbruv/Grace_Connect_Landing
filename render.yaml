services:
  - type: web
    name: graceconnect-app
    runtime: static
    # This repository is the pre-built static site: index.html, css/, js/, and
    # assets/ all live at the repository root. There is no Flutter build/web
    # output in this project.
    staticPublishPath: ./
    buildCommand: echo "Publishing root-level Grace Connect static site"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
